kind = "web"
previewPath = "/"
title = "Ecom Libya Store"
version = "1.0.0"
id = "artifacts/ecom-libya"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22037

[services.development]
run = "pnpm --filter @workspace/ecom-libya run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ecom-libya", "run", "build" ]
publicDir = "artifacts/ecom-libya/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22037"
BASE_PATH = "/"
