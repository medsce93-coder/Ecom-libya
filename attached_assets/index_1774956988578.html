    setOrders(localOrders);

      function addToCart(product) {
        setCart((current) => {
          const found = current.find((item) => item.id === product.id);
          if (found) {
            return current.map((item) =>
              item.id === product.id ? { ...item, quantity: item.quantity + 1 } : item
            );
          }
          return [...current, { ...product, quantity: 1 }];
        });
      }

      function updateQuantity(id, change) {
        setCart((current) =>
          current
            .map((item) =>
              item.id === id ? { ...item, quantity: Math.max(1, item.quantity + change) } : item
            )
            .filter((item) => item.quantity > 0)
        );
      }

      function removeFromCart(id) {
        setCart((current) => current.filter((item) => item.id !== id));

      async function handleCheckoutSubmit() {
  setCheckoutError("");
  setOrderSuccess(null);

  const fullName = checkoutData.fullName.trim();
  const city = checkoutData.city.trim();
  const phone = checkoutData.phone.trim();

  if (!fullName || !city || !phone) {
    setCheckoutError("المرجو تعمير الاسم الكامل والمدينة ورقم الهاتف.");
    return;
  }

  const cleanedPhone = phone.replace(/[^\d+]/g, "");
  if (cleanedPhone.length < 8) {
    setCheckoutError("رقم الهاتف غير صحيح.");
    return;
  }

  if (cart.length === 0) {
    setCheckoutError("السلة فارغة.");
    return;
  }

  const orderId = `ORD-${Date.now()}`;

  const cartItems = cart.map((item) => ({
    id: item.id,
    name: item.name,
    price: item.price,
    quantity: item.quantity,
    image: item.image,
  }));

  // هاد payload دابا مطابق 100% للجدول ديالك
  const payload = {
    order_code: orderId,
    full_name: fullName,
    city: city,
    phone: phone,
    product_name: JSON.stringify(cartItems),
    quantity: cart.reduce((sum, item) => sum + item.quantity, 0),
    unit_price: subtotal,
    shipping: shipping,
    total: total,
    status: "new"
  };

  if (supabaseClient) {
    const { error } = await supabaseClient
      .from("orders")
      .insert([payload]);

    if (error) {
      console.error("Insert order error:", error);
      setCheckoutError("وقع مشكل فحفظ الطلب. المرجو المحاولة مرة أخرى.");
      return;
    }
  }

  const localOrder = {
    id: orderId,
    customer: { fullName, city, phone },
    paymentMethod: "الدفع عند الاستلام",
    items: cartItems,
    subtotal,
    shipping,
    discount,
    total,
    status: "new",
    createdAt: new Date().toISOString(),
  };

  const existingOrders = JSON.parse(localStorage.getItem("orders") || "[]");
  localStorage.setItem("orders", JSON.stringify([localOrder, ...existingOrders]));

  setOrderSuccess({ id: orderId });
  setCart([]);
  setCoupon("");
  setCouponApplied(false);
  setCheckoutData({ fullName: "", city: "", phone: "", payment: "الدفع عند الاستلام" });

  loadOrders();
  setView("thankyou");
  window.history.pushState(null, '', '?step=thankyou');
  window.scrollTo({ top: 0, behavior: "smooth" });
}

      function exportOrdersCSV() {
        if (!orders.length) {
          alert("ما كايناش طلبات باش تصدّر.");
          return;
        }

        const rows = [
          [
            "Order ID",
            "Customer Name",
            "City",
            "Phone",
            "Payment Method",
            "Status",
            "Subtotal",
            "Shipping",
            "Discount",
            "Total",
            "Created At",
            "Items"
          ]
        ];

        orders.forEach((order) => {
          const itemsText = order.items
            .map((item) => `${item.name} x${item.quantity}`)
            .join(" | ");

          rows.push([
            order.id,
            order.customer.fullName,
            order.customer.city,
            order.customer.phone,
            order.paymentMethod,
            order.status,
            order.subtotal,
            order.shipping,
            order.discount,
            order.total,
            order.createdAt,
            itemsText
          ]);
        });

        const csvContent = "\uFEFF" + rows
          .map((row) =>
            row.map((value) => `"${String(value).replace(/"/g, '""')}"`).join(",")
          )
          .join("\n");

        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "orders.csv";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      }

                      <p className="font-semibold text-ink-900">طريقة الدفع</p>
                      <p className="mt-2 text-sm text-slate-600">الدفع عند الاستلام</p>
                    </div>

                    {checkoutError && (
                      <div className="mt-4 rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-medium text-red-600">
                        {checkoutError}
                      </div>
                    )}

                    <button
  type="button"
  onClick={handleCheckoutSubmit}
  className="mt-6 w-full rounded-2xl bg-ink-900 px-5 py-3 font-semibold text-white"
>
  تأكيد الطلب
</button>

                    <p className="mt-3 text-sm text-slate-500">
                      سنتواصل معك لتأكيد الطلب وتفاصيل التوصيل.
                    </p>
                  </div>
                </div>

                <div className="h-fit rounded-[1.6rem] border border-slate-200 bg-white p-6 shadow-soft text-right">
                  <h3 className="text-2xl font-bold">ملخص الطلب</h3>

                  <div className="mt-5 space-y-4">
                    {cart.length === 0 ? (
                      <p className="text-sm text-slate-500">السلة فارغة حالياً.</p>
                    ) : (
                      cart.map((item) => (
                        <div key={item.id} className="flex items-center justify-between gap-3 text-sm">
                          <span className="text-slate-600">{item.name} × {item.quantity}</span>
                          <span className="font-semibold">د.ل {item.price * item.quantity}</span>
                        </div>
                      ))
                    )}
                  </div>

                  <div className="mt-6 space-y-3 border-t border-slate-200 pt-4 text-sm">
                    <div className="flex items-center justify-between">
                      <span>المجموع الفرعي</span>
                      <span className="font-semibold">د.ل {subtotal}</span>
                    </div>
                    <div className="flex items-center justify-between">
                      <span>الشحن</span>
                      <span className="font-semibold">د.ل {shipping}</span>
                    </div>
                    <div className="flex items-center justify-between">
                      <span>الخصم</span>
                      <span className="font-semibold">- د.ل {discount}</span>
                    </div>
                    <div className="flex items-center justify-between text-base font-bold">
                      <span>الإجمالي</span>
                      <span>د.ل {total}</span>
                    </div>
                  </div>
                </div>
              </div>
            </section>
          )}

{view === "thankyou" && orderSuccess && (
            <section className="mx-auto max-w-3xl px-4 py-24 md:px-6 text-center">
              <div className="rounded-[1.6rem] border border-green-200 bg-white p-10 shadow-soft">
                <div className="mx-auto mb-6 flex h-24 w-24 items-center justify-center rounded-full bg-green-100 text-green-600 text-5xl">
                  ✓
                </div>
                <h2 className="text-4xl font-bold text-ink-900">شكراً لك! تم تأكيد طلبك بنجاح</h2>
                <p className="mt-5 text-lg text-slate-700">
                  رقم الطلب ديالك هو: <span className="font-bold text-brand">{orderSuccess.id}</span>
                </p>
                <p className="mt-3 text-slate-600">
                  سنتواصل معك في أقرب وقت لتأكيد تفاصيل الشحن والتوصيل.
                </p>
                <button
                  onClick={() => {
                    setView("home");
                    window.history.pushState(null, '', '/');
                    window.scrollTo({ top: 0, behavior: "smooth" });
                  }}
                  className="mt-10 rounded-2xl bg-ink-900 px-8 py-3 font-semibold text-white transition hover:opacity-90 shadow-md"
                >
                  العودة للرئيسية
                </button>
              </div>
            </section>
          )}

          {view === "admin" && (
            <section className="mx-auto max-w-7xl px-4 py-14 md:px-6">
              <div className="mb-8 text-right">
                <p className="text-sm font-semibold uppercase tracking-[0.2em] text-slate-500">لوحة الإدارة</p>
                <h2 className="mt-2 text-4xl font-bold">إدارة الطلبات</h2>
              </div>

              {!adminLoggedIn ? (
                <div className="mx-auto max-w-md rounded-[1.6rem] border border-slate-200 bg-white p-8 shadow-soft text-right">
                  <h3 className="text-2xl font-bold">تسجيل الدخول للإدارة</h3>
                  <p className="mt-2 text-sm text-slate-600">أدخل كلمة السر لعرض الطلبات.</p>

                  <input
                    type="password"
                    value={adminPassword}
                    onChange={(e) => setAdminPassword(e.target.value)}
                    placeholder="كلمة السر"
                    className="mt-5 w-full rounded-2xl border border-slate-300 px-4 py-3 text-right outline-none"
                  />

                  <button
                    onClick={handleAdminLogin}
                    className="mt-4 w-full rounded-2xl bg-ink-900 px-5 py-3 font-semibold text-white"
                  >
                    دخول
                  </button>
                </div>
              ) : (
                <div className="grid gap-6">
                  <div className="flex flex-wrap items-center justify-between gap-3 rounded-[1.6rem] border border-slate-200 bg-white p-5 shadow-soft">
                    <div className="text-right">
                      <p className="text-lg font-bold">عدد الطلبات: {orders.length}</p>
                      <p className="text-sm text-slate-500">يمكنك تغيير الحالة أو حذف أي طلب.</p>
                    </div>

                    <div className="flex flex-wrap gap-2">
                      <button
                        onClick={loadOrders}
                        className="rounded-xl border border-slate-300 px-4 py-2 text-sm font-semibold"
                      >
                        تحديث
                      </button>
                      <button
                        onClick={exportOrdersCSV}
                        className="rounded-xl border border-green-300 px-4 py-2 text-sm font-semibold text-green-700"
                      >
                        تصدير الطلبات CSV
                      </button>
                      <button
                        onClick={clearAllOrders}
                        className="rounded-xl border border-red-300 px-4 py-2 text-sm font-semibold text-red-600"
                      >
                        مسح الكل
                      </button>
                      <button
                        onClick={handleAdminLogout}
                        className="rounded-xl bg-ink-900 px-4 py-2 text-sm font-semibold text-white"
                      >
                        خروج
                      </button>
                    </div>
                  </div>

                  {orders.length === 0 ? (
                    <div className="rounded-[1.6rem] border border-dashed border-slate-300 bg-white p-10 text-center text-slate-500">
                      لا توجد طلبات حالياً.
                    </div>
                  ) : (
                    <div className="grid gap-5">
                      {orders.map((order) => (
                        <div
                          key={order.id}
                          className="rounded-[1.6rem] border border-slate-200 bg-white p-6 shadow-soft text-right"
                        >
                          <div className="flex flex-wrap items-start justify-between gap-4">
                            <div>
                              <div className="flex flex-wrap items-center gap-2 mb-2">
                                <h3 className="text-xl font-bold">{order.customer.fullName}</h3>
                                <span className={`rounded-full border px-3 py-1 text-xs font-semibold ${statusClass(order.status)}`}>
                                  {statusLabel(order.status)}
                                </span>
                              </div>
 {/* هادي هي التسكينة اللي تحت statusLabel فـ الكود ديالك */}

                              {/* 👇 هادا هو الكود الجديد اللي كيبين المنتجات اللي تشرّاو 👇 */}
                              <div className="mt-4 w-full rounded-xl bg-slate-50 p-4 border border-slate-100">
                                <h4 className="mb-3 text-sm font-bold text-slate-800 border-b border-slate-200 pb-2">📦 تفاصيل الطلبية:</h4>
                                <ul className="space-y-2">
                                  {/* كنقراو المنتجات من السلة ديال الطلب */}
                                  {(order.cart || order.items || []).map((item, idx) => (
                                    <li key={idx} className="flex justify-between items-center text-sm">
                                      <div className="flex items-center gap-2">
                                        <span className="font-semibold text-ink-900">{item.name}</span>
                                        <span className="rounded-md bg-slate-200 px-2 py-0.5 text-xs font-bold text-slate-600">x{item.quantity || 1}</span>
                                      </div>
                                      <span className="font-bold text-slate-700">د.ل {item.price}</span>
                                    </li>
                                  ))}
                                </ul>
                                <div className="mt-3 pt-3 border-t border-slate-200 flex justify-between items-center">
                                  <span className="text-sm font-bold text-slate-600">الإجمالي:</span>
                                  <span className="text-lg font-black text-green-600">د.ل {order.total}</span>
                                </div>
                              </div>
                              {/* 👆 نهاية كود المنتجات 👆 */}

                              <p className="mt-1 text-sm text-slate-600">رقم الطلب: {order.id}</p>
                              <p className="mt-1 text-sm text-slate-600">المدينة: {order.customer.city}</p>
                              <p className="mt-1 text-sm text-slate-600">الهاتف: {order.customer.phone}</p>
                              <p className="mt-1 text-sm text-slate-600">الإجمالي: د.ل {order.total}</p>
                              <p className="mt-1 text-sm text-slate-600">الدفع: {order.paymentMethod}</p>
                              <p className="mt-1 text-sm text-slate-600">
                                التاريخ: {new Date(order.createdAt).toLocaleString("ar-EG")}
                              </p>
                            </div>

                            <div className="flex flex-col gap-2">
                              <select
                                value={order.status || "new"}
                                onChange={(e) => updateOrderStatus(order.id, e.target.value)}
                                className="rounded-xl border border-slate-300 px-4 py-2 text-sm outline-none"
                              >
                                <option value="new">جديد</option>
                                <option value="confirmed">تم التأكيد</option>
                                <option value="shipped">تم الشحن</option>
                                <option value="delivered">تم التسليم</option>
                                <option value="cancelled">ملغي</option>
                              </select>

                              <button
                                onClick={() => copyOrderToWhatsApp(order)}
                                className="rounded-xl border border-blue-300 px-4 py-2 text-sm font-semibold text-blue-700"
                              >
                                نسخ الطلب
                              </button>

                              <button
                                onClick={() => openOrderInWhatsApp(order)}
                                className="rounded-xl border border-mint px-4 py-2 text-sm font-semibold text-mint"
                              >
                                إرسال لواتساب
                              </button>

                              <button
                                onClick={() => deleteOrder(order.id)}
                                className="rounded-xl border border-red-300 px-4 py-2 text-sm font-semibold text-red-600"
                              >
                                حذف الطلب
                              </button>
                            </div>
                          </div>

                          <div className="mt-5 border-t border-slate-200 pt-4">
                            <h4 className="font-bold">المنتجات</h4>
                            <div className="mt-3 grid gap-3">
                              {order.items.map((item) => (
                                <div
                                  key={`${order.id}-${item.id}`}
                                  className="flex items-center justify-between rounded-2xl bg-slate-50 px-4 py-3"
                                >
                                  <span className="text-sm text-slate-700">
                                    {item.name} × {item.quantity}
                                  </span>
                                  <span className="text-sm font-semibold">
                                    د.ل {item.price * item.quantity}
                                  </span>
                                </div>
                              ))}
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}
            </section>
          )}

          {view === "account" && (
            <section className="mx-auto max-w-5xl px-4 py-14 md:px-6">
              <div className="mx-auto max-w-xl rounded-[1.6rem] border border-slate-200 bg-white p-8 shadow-soft text-right">
                <div className="mb-6 flex gap-3">
                  <button onClick={() => setAuthMode("login")} className={`rounded-2xl px-5 py-3 text-sm font-semibold ${authMode === "login" ? "bg-ink-900 text-white" : "border border-slate-300"}`}>
                    تسجيل الدخول
                  </button>
                  <button onClick={() => setAuthMode("signup")} className={`rounded-2xl px-5 py-3 text-sm font-semibold ${authMode === "signup" ? "bg-ink-900 text-white" : "border border-slate-300"}`}>
                    إنشاء حساب
                  </button>
                </div>

                <h2 className="text-3xl font-bold">{authMode === "login" ? "أهلاً بعودتك" : "أنشئ حسابك"}</h2>
                <p className="mt-3 text-slate-600">{authMode === "login" ? "إدارة طلباتك بسهولة" : "تابع طلباتك واحصل على العروض"}</p>

                <div className="mt-6 grid gap-4">
                  {authMode === "signup" && <input type="text" placeholder="الاسم الكامل" className="rounded-2xl border border-slate-300 px-4 py-3 text-right outline-none" />}
                  <input type="email" placeholder="البريد الإلكتروني" className="rounded-2xl border border-slate-300 px-4 py-3 text-right outline-none" />
                  <input type="password" placeholder="كلمة المرور" className="rounded-2xl border border-slate-300 px-4 py-3 text-right outline-none" />
                  {authMode === "signup" && <input type="password" placeholder="تأكيد كلمة المرور" className="rounded-2xl border border-slate-300 px-4 py-3 text-right outline-none" />}
                  <button className="rounded-2xl bg-ink-900 px-5 py-3 font-semibold text-white">
                    {authMode === "login" ? "تسجيل الدخول" : "إنشاء الحساب"}
                  </button>
                </div>
              </div>
            </section>
          )}

          <footer className="border-t border-slate-200 bg-white">
            <div className="mx-auto grid max-w-7xl gap-10 px-4 py-12 md:grid-cols-4 md:px-6 text-right">
              <div>
                <h3 className="text-xl font-bold">متجر ليبيا</h3>
                <p className="mt-3 text-sm text-slate-600">متجر إلكتروني ليبي يقدم منتجات مختارة بعناية مع توصيل محلي ودفع عند الاستلام.</p>
              </div>
              <div>
                <h4 className="font-semibold">الروابط</h4>
                <div className="mt-3 grid gap-2 text-sm text-slate-600">
                  <button onClick={() => setView("home")} className="text-right">الرئيسية</button>
                  <button onClick={() => setView("shop")} className="text-right">المتجر</button>
                  <button onClick={() => setView("cart")} className="text-right">السلة</button>
                  <button onClick={() => setView("checkout")} className="text-right">إتمام الطلب</button>
                  <button onClick={() => setView("admin")} className="text-right">الإدارة</button>
                </div>
              </div>
              <div>
                <h4 className="font-semibold">الفئات</h4>
                <div className="mt-3 grid gap-2 text-sm text-slate-600">
                  {categories.slice(0, 6).map((c) => <span key={c.id}>{c.name}</span>)}
                </div>
              </div>
              <div>
                <h4 className="font-semibold">تواصل معنا</h4>
                <div className="mt-3 grid gap-2 text-sm text-slate-600">
                  <span>طرابلس، ليبيا</span>
                  <span>support@libyastore.ly</span>
                  <span>+218 91 000 0000</span>
                  <a href={`https://wa.me/${whatsappNumber}`} target="_blank" rel="noopener" className="text-mint font-semibold">تواصل واتساب</a>
                </div>
              </div>
            </div>
            <div className="border-t border-slate-200 px-4 py-6 text-center text-sm text-slate-500">
              © 2026 متجر ليبيا. جميع الحقوق محفوظة.
            </div>
          </footer>

          <a
            href={`https://wa.me/${whatsappNumber}?text=${encodeURIComponent("مرحبا، أحتاج مساعدة من متجر ليبيا")}`}
            target="_blank"
            rel="noopener"
            className="fixed bottom-4 left-4 z-50 flex items-center gap-2 rounded-full bg-mint px-4 py-3 text-sm font-semibold text-white shadow-card"
          >
            تواصل عبر واتساب
          </a>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(React.createElement(EcommerceHomepage));
  </script>
</body>
</html>
